<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect & Company | 채용 지원</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background: #f0f0f0;
            color: #111;
            padding: 3rem 1rem 4rem;
            font-size: 14px;
            line-height: 1.6;
        }

        /* ── 레이아웃 ── */
        .wrap {
            max-width: 860px;
            margin: 0 auto;
        }

        /* ── 헤더 ── */
        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-bottom: 3px solid #111;
            padding: 1.75rem 2rem 1.5rem;
            margin-bottom: 1.25rem;
        }
        .doc-header h1 {
            font-size: 1.375rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #111;
        }
        .doc-header .sub {
            font-size: 0.7rem;
            letter-spacing: 0.14em;
            color: #888;
            text-transform: uppercase;
        }

        /* ── 섹션 ── */
        .section {
            background: #fff;
            border: 1px solid #e0e0e0;
            padding: 1.75rem 2rem;
            margin-bottom: 1.25rem;
        }
        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ebebeb;
            padding-bottom: 0.625rem;
            margin-bottom: 1.25rem;
        }
        .section-title {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #111;
        }

        /* ── 레이블 · 인풋 ── */
        .field { margin-bottom: 0; }
        .field-label {
            display: block;
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 0.06em;
            margin-bottom: 0.35rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            background: #fafafa;
            border: 1px solid #d8d8d8;
            border-radius: 0;
            color: #111;
            padding: 0.65rem 0.85rem;
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.12s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #111;
        }
        input::placeholder, textarea::placeholder { color: #bbb; }
        input[readonly] { background: #f7f7f7; color: #888; cursor: default; }
        textarea { resize: vertical; min-height: 120px; }

        /* ── 그리드 ── */
        .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
        .span2 { grid-column: span 2; }
        @media (max-width: 600px) {
            .g2, .g3 { grid-template-columns: 1fr; }
            .span2 { grid-column: span 1; }
        }

        /* ── 기본정보 + 사진 ── */
        .info-photo {
            display: flex;
            gap: 2.5rem;
            align-items: flex-start;
        }
        .info-fields { flex: 1; min-width: 0; }
        .photo-col { flex-shrink: 0; }
        .photo-frame {
            width: 108px;
            height: 144px;
            border: 1px dashed #ccc;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: border-color 0.12s;
        }
        .photo-frame:hover { border-color: #999; }
        .photo-hint {
            font-size: 0.65rem;
            color: #aaa;
            text-align: center;
            line-height: 1.5;
        }
        @media (max-width: 600px) {
            .info-photo { flex-direction: column; }
            .photo-col { align-self: center; }
        }

        /* ── 주소 ── */
        .addr-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.5rem; }
        @media (max-width: 600px) { .addr-row { grid-template-columns: 1fr; } }

        /* ── 동적 행 ── */
        .row-item {
            display: grid;
            gap: 0.5rem;
            align-items: center;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            padding: 0.6rem 0.75rem;
            margin-bottom: 0.5rem;
        }
        .edu-row  { grid-template-columns: 88px 1fr 1fr 108px 100px 24px; }
        .cert-row { grid-template-columns: 1fr 1fr 96px 84px 24px; }
        .lang-row { grid-template-columns: 120px 1fr 96px 116px 24px; }
        @media (max-width: 600px) {
            .edu-row, .cert-row, .lang-row { grid-template-columns: 1fr 1fr; }
        }

        .row-item input,
        .row-item select { padding: 0.45rem 0.65rem; font-size: 0.8rem; }

        .exp-block {
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            padding: 1rem 1.25rem 0.875rem;
            position: relative;
            margin-bottom: 0.75rem;
        }
        .exp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
        .exp-block input, .exp-block select, .exp-block textarea {
            padding: 0.45rem 0.65rem; font-size: 0.8rem;
        }
        @media (max-width: 600px) { .exp-grid { grid-template-columns: 1fr 1fr; } }

        /* ── 버튼 ── */
        .btn-add {
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            color: #888;
            border: 1px solid #ccc;
            background: transparent;
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            transition: color 0.12s, border-color 0.12s;
        }
        .btn-add:hover { color: #111; border-color: #999; }

        .btn-del {
            background: transparent;
            border: none;
            color: #111;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0;
            line-height: 1;
            transition: color 0.12s;
        }
        .btn-del:hover { color: #555; }

        .btn-del-abs {
            position: absolute;
            top: 0.75rem;
            right: 1rem;
            background: transparent;
            border: none;
            font-size: 0.85rem;
            font-weight: 700;
            color: #111;
            cursor: pointer;
            line-height: 1;
            padding: 0 0.2rem;
            transition: color 0.12s;
        }
        .btn-del-abs:hover { color: #555; }

        /* ── 질문 ── */
        .q-block { margin-bottom: 1.75rem; }
        .q-block:last-child { margin-bottom: 0; }
        .q-num {
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            color: #aaa;
            text-transform: uppercase;
            display: block;
            margin-bottom: 0.3rem;
        }
        .q-text {
            font-size: 0.825rem;
            color: #444;
            margin-bottom: 0.6rem;
            display: block;
        }

        /* ── 제출 ── */
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: #111;
            color: #fff;
            border: none;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-submit:hover { background: #333; }
        .btn-submit:disabled { background: #ccc; color: #888; cursor: default; }

        /* ── 하단 ── */
        .doc-footer {
            max-width: 860px;
            margin: 2rem auto 0;
            display: flex;
            justify-content: space-between;
            font-size: 0.62rem;
            letter-spacing: 0.08em;
            color: #bbb;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
<div class="wrap">

    <header class="doc-header">
        <h1>입사 지원서</h1>
        <span class="sub">Connect &amp; Company</span>
    </header>

    <form id="applicationForm">

        <!-- 기본 정보 -->
        <div class="section">
            <div class="section-head">
                <span class="section-title">기본 정보</span>
            </div>
            <div class="info-photo">
                <div class="info-fields">
                    <div class="g2" style="gap:1rem 1.5rem;">
                        <div class="field">
                            <label class="field-label">이름</label>
                            <input type="text" id="inputName" required placeholder="홍길동">
                        </div>
                        <div class="field">
                            <label class="field-label">이메일</label>
                            <input type="email" id="inputEmail" required placeholder="example@email.com">
                        </div>
                        <div class="field">
                            <label class="field-label">전화번호</label>
                            <input type="tel" id="inputPhone" required placeholder="010-0000-0000">
                        </div>
                        <div class="field">
                            <label class="field-label">희망연봉 (만원)</label>
                            <input type="number" id="inputSalary" placeholder="3500">
                        </div>
                        <div class="field">
                            <label class="field-label">생년월일</label>
                            <input type="date" id="inputBirth" required onchange="updateAge()">
                        </div>
                        <div class="field">
                            <label class="field-label">만 나이</label>
                            <input type="text" id="inputAge" readonly placeholder="자동 계산">
                        </div>
                        <div class="field span2">
                            <label class="field-label">지원 직무</label>
                            <select id="inputJob" style="pointer-events:none; background:#f7f7f7; color:#888;">
                                <option value="HRD 컨설턴트" selected>HRD 컨설턴트</option>
                            </select>
                        </div>
                        <div class="field span2">
                            <label class="field-label">주소(거주지)</label>
                            <div class="addr-row">
                                <select id="inputCity" required onchange="updateDistrict()">
                                    <option value="">시/도 선택</option>
                                </select>
                                <select id="inputDistrict" required>
                                    <option value="">구/군 선택</option>
                                </select>
                            </div>
                            <input type="text" id="inputAddressDetail" placeholder="상세주소 (예: 테헤란로 123, 101동 502호)">
                        </div>
                    </div>
                </div>
                <div class="photo-col">
                    <label class="field-label" style="margin-bottom:0.45rem;">증명사진</label>
                    <div class="photo-frame" id="photoFrame" onclick="document.getElementById('photoInput').click()">
                        <img id="photoPreview" style="width:100%;height:100%;object-fit:cover;display:none;">
                        <span class="photo-hint" id="photoPlaceholder">클릭하여<br>사진 등록</span>
                    </div>
                    <input type="file" id="photoInput" accept="image/*" style="display:none;" onchange="previewImage(this)">
                </div>
            </div>
        </div>

        <!-- 학력 -->
        <div class="section">
            <div class="section-head">
                <span class="section-title">학력 사항</span>
                <button type="button" class="btn-add" onclick="addEduRow()">+ 학력 추가</button>
            </div>
            <div id="eduContainer"></div>
        </div>

        <!-- 경력 -->
        <div class="section">
            <div class="section-head">
                <span class="section-title">경력 사항 <span style="font-weight:300;font-size:0.7rem;color:#bbb;letter-spacing:0;text-transform:none;">(신입은 비워두세요)</span></span>
                <button type="button" class="btn-add" onclick="addExpBlock()">+ 경력 추가</button>
            </div>
            <div id="expContainer"></div>
        </div>

        <!-- 자격사항 -->
        <div class="section">
            <div class="section-head">
                <span class="section-title">자격사항</span>
                <button type="button" class="btn-add" onclick="addCertRow()">+ 자격증 추가</button>
            </div>
            <div id="certContainer"></div>
        </div>

        <!-- 어학 -->
        <div class="section">
            <div class="section-head">
                <span class="section-title">어학</span>
                <button type="button" class="btn-add" onclick="addLangRow()">+ 어학 추가</button>
            </div>
            <div id="langContainer"></div>
        </div>

        <!-- 자기소개 -->
        <div class="section">
            <div class="section-head">
                <span class="section-title">자기소개</span>
            </div>
            <div class="q-block">
                <span class="q-num">질문 01</span>
                <span class="q-text">HRD분야에 지원하게 된 동기는 무엇인가요?</span>
                <textarea id="inputQ1" rows="5" required></textarea>
            </div>
            <div class="q-block">
                <span class="q-num">질문 02</span>
                <span class="q-text">HRD컨설턴트(영업부문)는 어떤 일을 하는 것이라 생각하는가요? 본인이 그 일을 잘 할 수 있다고 판단하는 강점이 무엇인가요?</span>
                <textarea id="inputQ2" rows="5" required></textarea>
            </div>
            <div class="q-block">
                <span class="q-num">질문 03</span>
                <span class="q-text">결과의 성패유무와 관련없이 본인이 자신의 한계라 생각할 정도로 끝까지 노력했던 경험은 무엇인가요?</span>
                <textarea id="inputQ3" rows="5" required></textarea>
            </div>
        </div>

        <div class="section" style="padding:1.5rem 2rem;">
            <button type="submit" id="submitBtn" class="btn-submit">제출하기</button>
        </div>

    </form>

    <div class="doc-footer">
        <span>ⓒ Connect &amp; Company Co., Ltd.</span>
        <span>www.connectn.co.kr</span>
    </div>
</div>

        // 생년월일 입력 시 만 나이 자동 계산
        function calcAge(birthStr) {
            if (!birthStr) return null;
            const b = new Date(birthStr);
            if (isNaN(b.getTime())) return null;
            const today = new Date();
            if (b > today) return null;
            let age = today.getFullYear() - b.getFullYear();
            const m = today.getMonth() - b.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
            if (age < 0 || age > 120) return null;
            return age;
        }

        function updateAge() {
            const age = calcAge(document.getElementById('inputBirth').value);
            document.getElementById('inputAge').value = (age === null) ? '' : `만 ${age}세`;

        document.getElementById('applicationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "제출 중...";
            submitBtn.disabled = true;

            let step = '사진 업로드';
            try {
                let photoUrl = '';
                if (selectedPhotoFile) {
                    // 파일명에 한글이 들어가면 Supabase Storage가 거부하므로 영문/숫자만 사용
                    const ext = (selectedPhotoFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
                    const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

                    } else {
                        const { data: publicUrlData } = supabaseClient.storage.from('photos').getPublicUrl(fileName);

                    }
                }
                step = '지원서 저장';

                let eduArr = [];

                let certArr = [];

                    if (name) certArr.push(`${name} | ${row.querySelector('.cert-issuer').value} | ${row.querySelector('.cert-date').value} | ${row.querySelector('.cert-status').value}`);
                });

                let langArr = [];
                document.querySelectorAll('.lang-row').forEach(row => {
                    const score = row.querySelector('.lang-score').value;
                    if (score) langArr.push(`${row.querySelector('.lang-name').value} ${score} | ${row.querySelector('.lang-date').value} | ${row.querySelector('.lang-level').value}`);
                });

                let expArr = [];
                document.querySelectorAll('.exp-block').forEach(block => {
                    const comp = block.querySelector('.exp-company').value;
                    if(comp) expArr.push(`■ ${comp} / ${block.querySelector('.exp-title').value} / ${block.querySelector('.exp-role').value} (${block.querySelector('.exp-period').value}) / 연봉: ${block.querySelector('.exp-salary').value || '기재 안함'}\n- 상세: ${block.querySelector('.exp-details').value}`);
                });

                const finalData = {
                    name: document.getElementById('inputName').value,
                    email: document.getElementById('inputEmail').value,
                    phone: document.getElementById('inputPhone').value,
                    birth_date: document.getElementById('inputBirth').value || null,
                    address: [
                        document.getElementById('inputCity').value,
                        document.getElementById('inputDistrict').value,
                        document.getElementById('inputAddressDetail').value
                    ].filter(Boolean).join(' ') || '',
                    salary: document.getElementById('inputSalary').value,
                    job: document.getElementById('inputJob').value,
                    q1: document.getElementById('inputQ1').value,
                    q2: document.getElementById('inputQ2').value,
                    q3: document.getElementById('inputQ3').value,
                    education_history: eduArr.length > 0 ? eduArr.join('\n') : '입력 안함',
                    cert_history: certArr.length > 0 ? certArr.join('\n') : '없음',
                    lang_history: langArr.length > 0 ? langArr.join('\n') : '없음',
                    experience_history: expArr.length > 0 ? expArr.join('\n\n') : '신입 / 경력 없음',
                    photo_url: photoUrl
                };
                
                // 1. 수퍼베이스에 데이터 저장
                const { error: insertError } = await supabaseClient.from('applicants').insert([finalData]);
                if (insertError) throw insertError;

                // ★ 3. EmailJS로 관리자 알림 메일 전송 ★
                // 저장은 이미 끝났으므로 메일이 실패해도 지원자에게는 오류를 띄우지 않음
                try {
                    await emailjs.send("service_suvree6", "template_5g01hpk", {
                        name: finalData.name,
                        email: finalData.email,
                        phone: finalData.phone,
                        job: finalData.job,
                        salary: finalData.salary,
                        education_history: finalData.education_history,
                        experience_history: finalData.experience_history
                    });
                } catch (mailError) {
                    console.error('알림 메일 전송 실패:', mailError);
                }

                alert("지원서 제출이 완료되었습니다. 감사합니다!");
                location.reload(); 

            } catch (error) {
                console.error(`[${step}] 오류:`, error);
                const detail = error && (error.message || error.text || JSON.stringify(error));
                alert(`제출 중 오류가 발생했습니다 (${step}).\n\n${detail}\n\n이 메시지를 캡처해서 담당자에게 알려주세요.`);
            } finally {
                submitBtn.innerText = "제출하기";
                submitBtn.disabled = false;
            }
        });
    
</script>
