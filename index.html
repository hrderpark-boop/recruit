        (function initCitySelect() {

            Object.keys(REGIONS).forEach(city => {

                opt.value = city; opt.textContent = city;
                cityEl.appendChild(opt);

        function updateDistrict() {
            const city = document.getElementById('inputCity').value;
            const distEl = document.getElementById('inputDistrict');
            distEl.innerHTML = '<option value="">구/군 선택</option>';
            if (!city || !REGIONS[city]) return;
            REGIONS[city].forEach(d => {
                const opt = document.createElement('option');
                opt.value = d; opt.textContent = d;
                distEl.appendChild(opt);
            });
        }

        // 생년월일 입력 시 만 나이 자동 계산
        function calcAge(birthStr) {
            if (!birthStr) return null;
            const b = new Date(birthStr);
            if (isNaN(b.getTime())) return null;
            const today = new Date();
            if (b > today) return null;
            let age = today.getFullYear() - b.getFullYear();
            const m = today.getMonth() - b.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--;
            if (age < 0 || age > 120) return null;
            return age;
        }

        function updateAge() {
            const age = calcAge(document.getElementById('inputBirth').value);
            document.getElementById('inputAge').value = (age === null) ? '' : `만 ${age}세`;
        }

        // 미래 날짜는 선택할 수 없도록 제한
        document.getElementById('inputBirth').max = new Date().toISOString().split('T')[0];

        let selectedPhotoFile = null;
        function previewImage(input) {
            const preview = document.getElementById('photoPreview');
            const placeholder = document.getElementById('photoPlaceholder');
            if (input.files && input.files[0]) {
                selectedPhotoFile = input.files[0];
                const reader = new FileReader();
                reader.onload = e => {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                };
                reader.readAsDataURL(selectedPhotoFile);
            }
        }

                    q2: document.getElementById('inputQ2').value,
                    q3: document.getElementById('inputQ3').value,
                    education_history: eduArr.length > 0 ? eduArr.join('\n') : '입력 안함',
                    experience_history: expArr.length > 0 ? expArr.join('\n\n') : '신입 / 경력 없음',
                    photo_url: photoUrl
                };
                
                // 1. 수퍼베이스에 데이터 저장
                const { error: insertError } = await supabaseClient.from('applicants').insert([finalData]);
                if (insertError) throw insertError;

                // ★ 3. EmailJS로 관리자 알림 메일 전송 ★
                // 저장은 이미 끝났으므로 메일이 실패해도 지원자에게는 오류를 띄우지 않음
                try {
                    await emailjs.send("service_suvree6", "template_5g01hpk", {
                        name: finalData.name,
                        email: finalData.email,
                        phone: finalData.phone,
                        job: finalData.job,
                        salary: finalData.salary,
                        education_history: finalData.education_history,
                        experience_history: finalData.experience_history
                    });
                } catch (mailError) {
                    console.error('알림 메일 전송 실패:', mailError);
                }

                alert("지원서 제출이 완료되었습니다. 감사합니다!");
                location.reload(); 

            } catch (error) {
                console.error(`[${step}] 오류:`, error);
                const detail = error && (error.message || error.text || JSON.stringify(error));
                alert(`제출 중 오류가 발생했습니다 (${step}).\n\n${detail}\n\n이 메시지를 캡처해서 담당자에게 알려주세요.`);
            } finally {
                submitBtn.innerText = "제출하기";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
